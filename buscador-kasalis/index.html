<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscador Kasalis</title>
<meta name="description" content="Busca un código de falla Kasalis (PLC Pixid o KSvision) y ve todo lo relacionado: significado, guía, notas, procedimientos, manual y contexto.">
<script src="../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ui.css">
<style>
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 80px}
header{display:flex;align-items:center;gap:10px}
header .sp{flex:1}
h1{font-size:40px;font-weight:400;letter-spacing:-1px;margin:26px 0 2px;line-height:1.1}
h1 b{font-weight:700}
.sub{color:var(--ink2);margin-bottom:18px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:18px;height:46px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;justify-content:flex-end}
.chips .pill{height:36px;padding:0 14px;font-size:13px}
.sec{margin-top:18px}
.sec h3{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin:0 6px 8px}
/* tarjeta principal tipo carpeta */
.hero{position:relative;margin-top:22px}
.hero .tab{display:inline-flex;align-items:center;gap:8px;background:var(--invert);color:var(--invert-ink);padding:12px 18px 10px;border-radius:24px 24px 0 0;position:relative}
.hero .tab::after{content:"";position:absolute;right:-28px;bottom:0;width:28px;height:28px;background:radial-gradient(circle at 100% 0,transparent 27px,var(--invert) 28px)}
.hero .body{background:var(--invert);color:var(--invert-ink);border-radius:0 28px 28px 28px;padding:20px 22px;display:flex;gap:18px;align-items:center}
.hero .code{width:96px;height:96px;flex:0 0 96px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.hero h2{margin:0;font-size:22px;font-weight:600;word-break:break-word}
.hero p{margin:4px 0 0;opacity:.8}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hero .meta span{font-size:12px;border:1px solid rgba(127,127,127,.45);border-radius:999px;padding:3px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card h4{margin:0 0 8px;font-size:15px;font-weight:600}
.card ul{margin:6px 0 0;padding-left:18px} .card li{margin:3px 0}
.hint{font-size:14.5px;line-height:1.6}
.doc{padding:12px 0;border-top:1px solid var(--line)} .doc:first-of-type{border-top:0}
.doc .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:13px}
.doc .t a{color:var(--accent);font-weight:500;white-space:nowrap}
.doc .s{color:var(--ink2);font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.rel button:hover{border-color:var(--ink3)}
.list .row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.list .row:hover{background:var(--surface2);border-radius:14px}
.list .row b{font-variant-numeric:tabular-nums;font-size:16px}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:16px;color:var(--ink2);font-size:13px}
.empty code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:12px}
.steps{display:grid;gap:10px;margin-top:8px}
.steps .st{display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps .st .n{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:12px}
.steps img{max-width:100%;border-radius:12px;margin-top:6px;border:1px solid var(--line)}
.freq{display:grid;gap:6px}
.freq .f{display:grid;grid-template-columns:70px 1fr 50px;gap:10px;align-items:center;cursor:pointer}
.freq .bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden} .freq .bar i{display:block;height:100%;background:var(--ink)}
.note{background:rgba(224,163,46,.12);border:1px solid rgba(224,163,46,.35);border-radius:16px;padding:10px 14px;font-size:13px}
@media (max-width:720px){ h1{font-size:32px} .grid2{grid-template-columns:1fr} .hero .body{flex-direction:column;align-items:flex-start} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="round light" href="../index.html" title="Apps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="muted">Apps / Kasalis</span>
    <div class="sp"></div>
    <a class="pill" href="../simulador-lineas/" title="Ver la Kasalis en el simulador">Simulador</a>
    <button class="round" data-theme-toggle></button>
  </header>

  <h1>Buscador de <b>fallas</b></h1>
  <div class="sub">Kasalis Pixid 500 · códigos PLC (KSmessage) y KSvision, manual, notas y procedimientos.</div>

  <div class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" autocomplete="off" placeholder="105, 161, -350, gripper, DELLO, particle…">
    <button class="pill on" id="go">Buscar</button>
  </div>
  <div class="chips" id="chips"></div>

  <div id="out"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
