<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fallas Kasalis</title>
<meta name="description" content="Fallas Kasalis: busca un código y sigue el flujo de resolución paso a paso.">
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasalis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<script src="../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ui.css">
<style>
html,body{overscroll-behavior-y:none}
body{-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .round{width:40px;height:40px}
.bar h1{flex:1;margin:0;font-size:22px;font-weight:600;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{max-width:760px;margin:10px auto 0;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:0 6px 0 16px;border:1px solid var(--line);height:48px}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;height:46px;min-width:0}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .x{border:0;background:var(--surface2);width:30px;height:30px;border-radius:50%;cursor:pointer;display:none}
main{max-width:760px;margin:0 auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 96px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.tabs a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0;font-weight:500}
.tabs a.on{color:var(--ink)}
.tabs svg{width:24px;height:24px}
h3.lb{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin:22px 4px 8px}
/* tarjetas de modos de falla */
.modes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mode{min-width:0;overflow-wrap:anywhere}
.mode{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:132px;border:1px solid var(--line)}
.mode:active{transform:scale(.98)}
.mode .ic{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--kas) 18%,transparent);color:var(--kas);display:grid;place-items:center}
.mode .ic svg{width:20px;height:20px}
.mode b{font-size:15px;line-height:1.25}
.mode span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.codes i{font-style:normal;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:999px;padding:2px 8px}
.mode.dark{background:var(--invert);color:var(--invert-ink);border-color:var(--invert)}
.mode.dark span{color:inherit;opacity:.7} .mode.dark .ic,.mode.dark .codes i{background:rgba(127,127,127,.25)}
/* cabecera de detalle */
.head{background:var(--invert);color:var(--invert-ink);border-radius:26px;padding:18px;margin-top:6px}
.head .k{font-size:12px;opacity:.7}
.head h2{margin:4px 0 4px;font-size:22px;line-height:1.2;word-break:break-word}
.head p{margin:0;opacity:.8;font-size:14px}
.head .codes{margin-top:12px}
.head .codes button{border:0;font:inherit;font-size:12px;font-weight:600;background:rgba(127,127,127,.28);color:inherit;border-radius:999px;padding:5px 11px;cursor:pointer}
.big{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
/* flujo */
.flow{background:var(--surface);border-radius:22px;padding:6px 14px;border:1px solid var(--line)}
.st{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;position:relative}
.st:not(:last-child)::before{content:"";position:absolute;left:14px;top:42px;bottom:-12px;width:2px;background:var(--surface2)}
.st .n{width:30px;height:30px;border-radius:50%;background:var(--invert);color:var(--invert-ink);display:grid;place-items:center;font-weight:600;font-size:13px;position:relative;z-index:1}
.st b{font-size:15px;display:block;line-height:1.35;padding-top:4px}
.st .d{color:var(--ink2);font-size:13.5px;margin-top:2px;line-height:1.45}
.br{display:flex;gap:8px;margin-top:7px;font-size:13px;line-height:1.4;align-items:flex-start}
.br em{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;flex:0 0 auto;margin-top:1px}
.br.si em{background:rgba(34,160,107,.18);color:var(--ok)}
.br.no em{background:rgba(229,72,77,.16);color:var(--fail)}
.procbtn{display:inline-flex;align-items:center;gap:8px;margin-top:9px;height:34px;padding:0 13px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-size:12.5px;cursor:pointer}
.procbtn small{font-weight:600;color:var(--ink3);font-size:11px}
.ca{background:var(--surface);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.ca .r{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
.ca .r:first-child{border-top:0}
.ca .r span:last-child{color:var(--ink2)}
.tips{display:grid;gap:8px}
.tips div{background:rgba(224,163,46,.12);border:1px solid rgba(224,163,46,.3);border-radius:16px;padding:10px 14px;font-size:13.5px}
.card h4{margin:0 0 6px;font-size:15px}
.hint{font-size:14px;line-height:1.55}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:8px;cursor:pointer;font-weight:500}
details.more{background:var(--surface);border-radius:22px;border:1px solid var(--line);margin-top:10px}
details.more summary{padding:14px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";color:var(--ink3);font-weight:400;font-size:18px;line-height:1}
details.more[open] summary::after{content:"–"}
details.more .in{padding:0 16px 14px}
.doc{padding:10px 0;border-top:1px solid var(--line)} .doc:first-child{border-top:0}
.doc .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:13px}
.doc .t a{color:var(--accent);font-weight:500;white-space:nowrap}
.doc .s{color:var(--ink2);font-size:12.5px;margin-top:4px;word-break:break-word}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:12.5px}
.list{background:var(--surface);border-radius:22px;border:1px solid var(--line);padding:0 14px}
.list .row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.list .row:first-child{border-top:0}
.list .row b{font-variant-numeric:tabular-nums;font-size:15px}
.list .row small{display:block;color:var(--ink3);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--ink2);font-size:13.5px;padding:14px 4px}
.install{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px;font-size:13.5px;line-height:1.55}
.install ol{margin:6px 0 0;padding-left:20px}
@media (min-width:640px){ .modes{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (display-mode: standalone){ .hide-app{display:none} }
:root{--kas:#FF7F66;--m:#FF7F66}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px 2px 7px;border-radius:99px;background:color-mix(in srgb,var(--m) 16%,transparent);white-space:nowrap;border:0;height:auto}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--m)}
.mode .top-r{display:flex;align-items:center;justify-content:space-between;gap:6px}
.head .tag{background:rgba(255,127,102,.28)}
.en{display:block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px!important;letter-spacing:.01em;opacity:.65;margin-top:2px;word-break:break-word}
.head p.en{margin-top:4px}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <button class="round" id="back" title="Atrás" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="ttl">Fallas Kasalis</h1>
    <button class="round" data-theme-toggle></button>
  </div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink3);flex:0 0 auto"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Código o palabra: 102, 161, pogo…">
    <button class="x" id="clr" aria-label="Borrar">✕</button>
  </div>
</div>
<main id="out"></main>
<nav class="tabs">
  <a href="#" data-tab="fallas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Fallas</a>
  <a href="#codigos" data-tab="codigos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Códigos</a>
  <a href="#info" data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>Más</a>
</nav>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
