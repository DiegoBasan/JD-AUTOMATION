<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasalis 3D</title>
<meta name="description" content="Simulación 3D del ciclo de la Kasalis: carga, dispensado, alineación y spare con los parámetros reales.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasalis 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="../assets/icons/kasalis3d.svg">
<script src="../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
/* Mismo lenguaje visual que el hub (Diapps): Urbanist, grises neutros, vidrio, hojas inferiores */
:root{
  --bg:#F2F2F3; --ink:#141416; --ink2:#7C7C84; --line:#D6D6DA; --chip:#FFFFFF;
  --glass:rgba(255,255,255,.62); --glassBorder:rgba(255,255,255,.85); --glassShadow:rgba(20,20,25,.16);
  --lime:#C6EE3A; --scrim:rgba(0,0,0,.3); --sheet:#FFFFFF;
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E0E10; --ink:#F2F2F4; --ink2:#8C8C94; --line:#2C2C31; --chip:#1A1A1D;
  --glass:rgba(38,38,44,.62); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --sheet:#1A1A1D;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button,a{-webkit-user-select:none;user-select:none}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1)} .press:active{transform:scale(.94)}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.labels>div{pointer-events:auto}
.st-label{font:700 12px var(--font);padding:5px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--glassBorder);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;transition:transform .2s}
.st-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.st-label.load{--c:#E5484D}.st-label.disp{--c:#E8913A}.st-label.align{--c:#9B59D0}.st-label.spare{--c:#3E63DD}
.st-label.on{background:var(--ink);color:var(--bg);transform:scale(1.08)}
.st-label.now{outline:2px solid var(--c);outline-offset:2px}

/* barra superior */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;pointer-events:none}
.top>*{pointer-events:auto}
.rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--glass);border:1px solid var(--glassBorder);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 6px 18px var(--glassShadow)}
.rb svg{width:20px;height:20px}
.brand{display:flex;flex-direction:column;padding:6px 14px;border-radius:22px;background:var(--glass);border:1px solid var(--glassBorder);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand{padding:6px 12px}.brand b{font-size:15px}.seg button{padding:0 10px;font-size:12px}}
.top .sp{flex:1}
.seg{display:flex;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--glassBorder);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.seg button{height:36px;padding:0 13px;border-radius:99px;font-weight:700;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* tarjeta del paso actual */
.card{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--chip);border-radius:26px;padding:14px 16px;box-shadow:0 14px 40px var(--glassShadow);max-width:520px;margin:0 auto}
.card .h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.card .h i{width:9px;height:9px;border-radius:50%;background:var(--c,#888)}
.card .h span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.card h2{margin:4px 0 2px;font-size:20px;letter-spacing:-.02em}
.card p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chips span,.chips a{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--bg)}
.chips a{background:color-mix(in srgb,#E5484D 14%,var(--bg));color:#C2292E}
.chips a.on{background:#E5484D;color:#fff}
.flow{margin-top:10px;display:grid;gap:6px}
.flow div{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:13px;font-weight:600}
.flow i{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:11px}
.flow small{display:block;color:var(--ink2);font-weight:500}
.more{display:inline-flex;margin-top:10px;font-weight:700;font-size:13px;padding:8px 12px;border-radius:99px;background:var(--ink);color:var(--bg)}

/* línea de tiempo + controles de vidrio */
.dock{position:fixed;left:50%;bottom:max(12px,calc(env(safe-area-inset-bottom,0px) - 4px));transform:translateX(-50%);z-index:6;width:min(520px,calc(100vw - 24px));padding:10px;border-radius:30px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--glassBorder),0 14px 34px var(--glassShadow)}
.tl{position:relative;height:22px;display:flex;gap:2px;align-items:center;cursor:pointer;margin:0 6px 8px;touch-action:none}
.tl i{height:8px;border-radius:4px;background:var(--c);opacity:.35;transition:opacity .2s}
.tl i.done{opacity:.95}
.tl .ph{position:absolute;top:1px;width:4px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-2px);pointer-events:none}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ctl button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.ctl button svg{width:21px;height:21px}
.ctl .play{width:62px;height:62px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
:root:not([data-theme="dark"]) .ctl .play{background:#141416;color:#fff}
.ctl .spd{width:auto;padding:0 14px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.ctl .t{font-weight:700;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:74px;text-align:center}

/* hoja / panel */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:520px;margin:0 auto;background:var(--sheet);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:82dvh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex:none}
.tabs button{flex:1;height:40px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:13.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{overflow:auto;flex:1;min-height:0;padding-bottom:6px}
.step{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:14px}
.step i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.step b{font-size:14px;font-weight:600;display:block}
.step small{color:var(--ink2);font-size:12px}
.step em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.step.on{background:var(--bg)}
.step.on b{font-weight:800}
.prm{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);font-size:13.5px}
.prm:first-child{border-top:0}
.prm small{display:block;color:var(--ink2);font-size:11.5px}
.prm input{width:100%;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--font);padding:0 10px;text-align:right}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--bg);border-radius:16px;padding:10px 12px}
.sum small{display:block;font-size:11.5px;color:var(--ink2);font-weight:600}
.sum b{font-size:19px;font-variant-numeric:tabular-nums}
.btn{height:44px;border-radius:99px;display:grid;place-items:center;font-weight:700;border:1.5px solid var(--line);width:100%;margin-top:12px}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.codes button{height:38px;padding:0 13px;border-radius:99px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.codes button.on{background:#E5484D;color:#fff}
.lb{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;margin:14px 2px 8px}
.views{display:flex;flex-wrap:wrap;gap:6px}
.views button{height:36px;padding:0 13px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13px}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);font-weight:700;color:var(--ink2);transition:opacity .4s}
.loading.out{opacity:0;pointer-events:none}

/* escritorio: panel fijo a la derecha */
@media (min-width:1100px){
  #stage,.top{right:420px}
  .card{left:24px;right:auto;bottom:130px;width:440px;margin:0}
  .dock{left:calc((100vw - 420px)/2)}
  .sheet{left:auto;right:0;top:0;bottom:0;width:420px;max-width:none;max-height:none;border-radius:0;transform:none;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;border-left:1px solid var(--line);background:var(--chip)}
  .sheet .grab,.scrim,#menu{display:none!important}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage"></div>
<div class="loading" id="loading">Cargando la Kasalis…</div>

<header class="top">
  <a class="rb press" href="../" aria-label="Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="brand"><b>Kasalis 3D</b><small id="sub">Ciclo BUILD</small></div>
  <span class="sp"></span>
  <div class="seg" id="mode"><button data-m="build" aria-pressed="true">BUILD</button><button data-m="retest">RETEST</button></div>
  <button class="rb press" data-theme-toggle aria-label="Tema"></button>
</header>

<section class="card" id="card"></section>

<div class="dock">
  <div class="tl" id="tl"></div>
  <div class="ctl">
    <button class="press" id="menu" aria-label="Pasos y parámetros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button class="press" id="prev" aria-label="Paso anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="press play" id="play" aria-label="Reproducir"></button>
    <button class="press" id="next" aria-label="Paso siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="press spd" id="spd">1×</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="tabs" id="tabs"><button data-t="steps" aria-pressed="true">Pasos</button><button data-t="params">Parámetros</button><button data-t="fault">Falla</button></div>
  <div class="pane" id="pane"></div>
</aside>

<script type="module" src="js/app.js"></script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
