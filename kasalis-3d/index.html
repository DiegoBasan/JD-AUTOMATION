<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasalis 3D</title>
<meta name="description" content="Simulación 3D del ciclo de la Kasalis: carga, dispensado con visión VIS, alineación activa con curvas through-focus, UV y spare.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasalis 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="../assets/icons/kasalis3d.svg">
<script src="../shared/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap">
<style>
/* Mismo lenguaje visual que el hub (Diapps). La UI flota en las orillas y se puede plegar para no tapar la máquina. */
:root{
  --bg:#F2F2F3; --ink:#141416; --ink2:#7C7C84; --line:#D6D6DA; --chip:#FFFFFF;
  --glass:rgba(255,255,255,.78); --glassBorder:rgba(255,255,255,.85); --glassShadow:rgba(20,20,25,.16);
  --lime:#C6EE3A; --scrim:rgba(0,0,0,.3); --sheet:#FFFFFF; --ok:#1F9D55; --bad:#E5484D;
  --font:"Urbanist",-apple-system,"SF Pro Text",system-ui,sans-serif;
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E0E10; --ink:#F2F2F4; --ink2:#8C8C94; --line:#2C2C31; --chip:#1A1A1D;
  --glass:rgba(30,30,34,.8); --glassBorder:rgba(255,255,255,.1); --glassShadow:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --sheet:#1A1A1D; --ok:#3DD68C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
button,a{-webkit-user-select:none;user-select:none}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1)} .press:active{transform:scale(.94)}
.glass{background:var(--glass);border:1px solid var(--glassBorder);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);box-shadow:0 8px 24px var(--glassShadow)}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.labels>div{pointer-events:auto}
.st-label{font:700 11.5px var(--font);padding:4px 9px;border-radius:99px;background:var(--glass);border:1px solid var(--glassBorder);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;opacity:.85}
.st-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-label.load{--c:#E5484D}.st-label.disp{--c:#E8913A}.st-label.align{--c:#9B59D0}.st-label.spare{--c:#3E63DD}
.st-label.on{background:#E5484D;color:#fff;opacity:1}
.st-label.now{opacity:1;outline:2px solid var(--c);outline-offset:1px}

/* barra superior */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px;pointer-events:none}
.top>*{pointer-events:auto}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.rb svg{width:19px;height:19px}
.rb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.brand{display:flex;flex-direction:column;padding:5px 13px;border-radius:21px;min-width:0}
.brand b{font-size:16px;font-weight:700;white-space:nowrap}
.brand small{font-size:11.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.seg{display:flex;padding:3px;border-radius:99px}
.seg button{height:34px;padding:0 12px;border-radius:99px;font-weight:700;font-size:12.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* paso actual: una línea, se abre al tocar */
.step-pill{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 24px));border-radius:22px;padding:9px 12px;cursor:pointer}
.step-pill .row{display:flex;align-items:center;gap:8px;min-width:0}
.step-pill .row i{width:9px;height:9px;border-radius:50%;background:var(--c,#888);flex:none}
.step-pill .row b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.step-pill .row span{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.step-pill .row em{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--bad);color:#fff}
.step-pill .more{display:none;margin-top:6px}
.step-pill.open .more{display:block}
.step-pill p{margin:0;color:var(--ink2);font-size:13px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips span,.chips a{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.chips a{background:color-mix(in srgb,#E5484D 14%,transparent);color:#C2292E}
.chips a.on{background:#E5484D;color:#fff}
:root[data-theme="dark"] .chips a{color:#ff8b8f}

/* cámara (picture in picture) */
.cam{background:var(--chip)!important;position:fixed;z-index:6;top:calc(64px + env(safe-area-inset-top,0px));right:12px;width:min(300px,56vw);border-radius:20px;overflow:hidden}
.cam .hd{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 12px;font-size:12px;font-weight:800}
.cam .hd span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .hd button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.cam .hd button svg{width:14px;height:14px}
.cam canvas{display:block;width:100%;height:auto;background:#000}
.cam canvas.tf{background:transparent}
.cam .res{display:flex;gap:5px;flex-wrap:wrap;padding:7px 10px 4px;font-size:11px;font-weight:700}
.cam .res span{padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 7%,transparent);font-variant-numeric:tabular-nums}
.cam .res .ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.cam .res .bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.cam .msg{padding:3px 10px 9px;font-size:11.5px;color:var(--ink2);line-height:1.35}
.cam.min{width:auto}
.cam.min .bd{display:none}
.cam .sw{display:flex;gap:4px;padding:0 8px 6px}
.cam .sw button{flex:1;height:26px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.cam .sw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.follow-pill{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(180px + env(safe-area-inset-bottom,0px));height:38px;padding:0 14px;border-radius:99px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.follow-pill svg{width:16px;height:16px}

/* línea de tiempo + controles */
.dock{position:fixed;left:50%;bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 4px));transform:translateX(-50%);z-index:6;width:min(520px,calc(100vw - 24px));padding:8px 10px;border-radius:28px}
.tl{position:relative;height:20px;display:flex;gap:2px;align-items:center;cursor:pointer;margin:0 4px 6px;touch-action:none}
.tl i{height:7px;border-radius:4px;background:var(--c);opacity:.3}
.tl i.done{opacity:.95}
.tl i.f{outline:2px solid #E5484D;outline-offset:1px;opacity:1}
.tl .ph{position:absolute;top:1px;width:4px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-2px);pointer-events:none}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ctl button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.ctl button svg{width:19px;height:19px}
.ctl .play{width:56px;height:56px;background:#141416;color:#fff;border-color:#141416}
:root[data-theme="dark"] .ctl .play{background:#F2F2F4;color:#141416;border-color:#F2F2F4}
.ctl .spd{width:auto;padding:0 13px;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}

/* hoja (celular) / panel (escritorio) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:9;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:560px;margin:0 auto;background:var(--sheet);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:86dvh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 10px;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex:none}
.tabs button{flex:1;height:38px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pane{overflow:auto;flex:1;min-height:0;padding-bottom:6px}
.stepbtn{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:14px}
.stepbtn i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.stepbtn b{font-size:13.5px;font-weight:600;display:block}
.stepbtn small{color:var(--ink2);font-size:11.5px}
.stepbtn em{font-style:normal;font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.stepbtn.on{background:var(--bg)} .stepbtn.on b{font-weight:800}
.prm{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:6px 4px;border-top:1px solid var(--line);font-size:13px}
.prm small{display:block;color:var(--ink2);font-size:11px}
.prm input{width:100%;height:34px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;padding:0 10px;text-align:right}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sum div{background:var(--bg);border-radius:16px;padding:9px 11px}
.sum small{display:block;font-size:11px;color:var(--ink2);font-weight:600}
.sum b{font-size:18px;font-variant-numeric:tabular-nums}
.btn{height:42px;border-radius:99px;display:grid;place-items:center;font-weight:700;border:1.5px solid var(--line);width:100%;margin-top:10px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lb{font-size:11.5px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 7px}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.codes button{height:34px;padding:0 12px;border-radius:99px;background:var(--bg);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.codes button.on{background:#E5484D;color:#fff}
.views{display:flex;flex-wrap:wrap;gap:6px}
.views button{height:34px;padding:0 12px;border-radius:99px;background:var(--bg);font-weight:700;font-size:12.5px}
/* flujo de resolución (igual que Fallas Kasalis) */
.fhead{background:var(--ink);color:var(--bg);border-radius:20px;padding:14px}
.fhead small{opacity:.85;font-size:12px}
.ktag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px 2px 7px;border-radius:99px;background:rgba(255,127,102,.3);margin-right:6px}
.ktag::before{content:"";width:7px;height:7px;border-radius:50%;background:#FF7F66}
.fhead h3{margin:2px 0 4px;font-size:19px}
.fhead p{margin:0;opacity:.8;font-size:13px}
.flow{background:var(--bg);border-radius:18px;padding:4px 12px}
.fs{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;position:relative}
.fs:not(:last-child)::before{content:"";position:absolute;left:12px;top:38px;bottom:-10px;width:2px;background:var(--line)}
.fs .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:12px;position:relative;z-index:1}
.fs b{font-size:14px;display:block;padding-top:3px}
.fs .d{color:var(--ink2);font-size:12.5px;margin-top:2px;line-height:1.4}
.br{display:flex;gap:7px;margin-top:6px;font-size:12.5px;line-height:1.4}
.br em{font-style:normal;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;flex:none;height:18px}
.br.si em{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.br.no em{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.procbtn{display:inline-flex;align-items:center;gap:8px;margin-top:8px;height:32px;padding:0 12px;border-radius:99px;border:1.5px solid var(--ink);font-weight:700;font-size:12px}
.procbtn small{font-weight:600;color:var(--ink2);font-size:11px}
.ca{background:var(--bg);border-radius:16px;overflow:hidden}
.ca div{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px}
.ca div:first-child{border-top:0}
.ca span:last-child{color:var(--ink2)}
.tips div{background:color-mix(in srgb,#E0A32E 13%,transparent);border-radius:13px;padding:8px 11px;font-size:12.5px;margin-top:6px}
.simnote{border:1.5px dashed var(--line);border-radius:14px;padding:9px 11px;font-size:12.5px;color:var(--ink2);margin-top:10px}
.link{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:11px 14px;border-radius:16px;background:var(--bg);font-weight:700;font-size:13.5px}

/* vista ampliada de la cámara */
.big{position:fixed;z-index:12;inset:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.big .bh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.big .bh b{flex:1;font-size:16px}
.big .bh button{width:34px;height:34px;border-radius:50%;background:var(--bg);font-weight:800}
.big .bb{flex:1;overflow:auto;padding:14px;display:grid;gap:14px;grid-template-columns:1fr;align-content:start}
.big .imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .imgs small{display:block;font-size:11.5px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.big canvas{width:100%;height:auto;display:block;border-radius:12px;background:#000}
.big canvas.tf{background:transparent}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter div{background:var(--bg);border-radius:14px;padding:9px 11px}
.meter small{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.meter b{font-size:18px;font-variant-numeric:tabular-nums}
.meter b.ok{color:var(--ok)} .meter b.bad{color:var(--bad)}
.meter .bar{position:relative;height:6px;border-radius:9px;background:var(--line);margin-top:7px}
.meter .bar i{position:absolute;top:0;bottom:0;border-radius:9px;background:color-mix(in srgb,var(--ok) 55%,transparent)}
.meter .bar u{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink)}
.verdict{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.verdict small{font-size:13px;font-weight:600;color:var(--ink2)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 14px}
.ctrls label{font-size:12px;font-weight:700;color:var(--ink2);display:grid;gap:2px}
.ctrls label span{display:flex;justify-content:space-between}
.ctrls label span b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctrls input[type=range]{width:100%;accent-color:var(--ink)}
.var{display:flex;flex-wrap:wrap;gap:6px}
.var button{height:32px;padding:0 12px;border-radius:99px;background:var(--bg);font-weight:700;font-size:12.5px}
.var button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ztab{width:100%;border-collapse:collapse;font-size:13px}
.ztab td{padding:6px 4px;border-top:1px solid var(--line)}
.ztab td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.ztab i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-weight:700}
.pipe span{padding:6px 10px;border-radius:10px;background:var(--bg)}
.pipe i{font-style:normal;color:var(--ink2)}
.tiltx{font-size:13px;font-weight:700;line-height:1.5}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);font-weight:700;color:var(--ink2);transition:opacity .4s}
.loading.out{opacity:0;pointer-events:none}

/* escritorio: panel fijo a la derecha, cámara arriba a la izquierda */
@media (min-width:1100px){
  #stage,.top{right:400px}
  .cam{right:auto;left:16px;top:72px;width:320px}
  .step-pill{left:calc((100vw - 400px)/2);bottom:118px}
  .dock{left:calc((100vw - 400px)/2)}
  .follow-pill{left:calc((100vw - 400px)/2);bottom:168px}
  .sheet{left:auto;right:0;top:0;bottom:0;width:400px;max-width:none;max-height:none;border-radius:0;transform:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;border-left:1px solid var(--line);background:var(--chip)}
  .sheet .grab,.scrim,#menu{display:none!important}
  .big{inset:24px 424px 24px 24px}
  .big .bb{grid-template-columns:1.25fr 1fr}
}
@media (max-width:420px){ .brand b{font-size:14.5px} .seg button{padding:0 9px;font-size:11.5px} .rb{width:38px;height:38px} }
</style>
<script type="importmap">

</script>

<body>
<div id="stage"></div>
<div class="loading" id="loading">Cargando la Kasalis…</div>

<header class="top">
  <a class="rb glass press" href="../" aria-label="Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="brand glass"><b>Kasalis 3D</b><small id="sub">Ciclo BUILD</small></div>
  <span class="sp"></span>
  <button class="rb glass press" id="followBtn" aria-pressed="true" aria-label="Seguir la pieza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <div class="seg glass" id="mode"><button data-m="build" aria-pressed="true">BUILD</button><button data-m="retest">RETEST</button></div>
  <button class="rb glass press" data-theme-toggle aria-label="Tema"></button>
</header>

<section class="cam glass" id="cam" hidden></section>
<button class="follow-pill glass press" id="followPill" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Seguir la pieza</button>
<section class="step-pill glass" id="card"></section>

<div class="dock glass">
  <div class="tl" id="tl"></div>
  <div class="ctl">
    <button class="press" id="menu" aria-label="Pasos, fallas y parámetros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button class="press" id="prev" aria-label="Paso anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="press play" id="play" aria-label="Reproducir"></button>
    <button class="press" id="next" aria-label="Paso siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="press spd" id="spd">1×</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="tabs" id="tabs"><button data-t="steps" aria-pressed="true">Pasos</button><button data-t="fault">Fallas</button><button data-t="params">Parámetros</button></div>
  <div class="pane" id="pane"></div>
</aside>
<section class="big" id="big" hidden></section>

<script type="module" src="js/app.js"></script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
